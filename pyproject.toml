[project]
name = "p2p-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aioitertools>=0.13.0",
    "aiosqlite>=0.22.1",
    "async-lru>=2.3.0",
    "cryptography>=48.0.0",
    "pydantic>=2.13.4",
    "pynacl>=1.6.2",
    "pytest-cov>=7.1.0",
    "python-dotenv>=1.2.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "shadow: tests that use shadow network simulator (requires shadow binary)",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]
